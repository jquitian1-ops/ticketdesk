name: Publish Tasks to Linear

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual issues created)'
        required: false
        default: 'false'

jobs:
  publish:
    name: Publish Tasks to Linear
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML requests

      - name: Publish tasks to Linear
        env:
          LINEAR_API_TOKEN: ${{ secrets.LINEAR_API_TOKEN || '' }}
        run: |
          echo "LINEAR_API_TOKEN is set: ${{ secrets.LINEAR_API_TOKEN != '' }}"
          python scripts/publish-tasks-to-linear.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          if [ -f "Estación 6/docs/tasks/linear-publish-results.json" ]; then
            git add "Estación 6/docs/tasks/linear-publish-results.json"
            git commit -m "docs: Linear publish results - $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || true
            git push
          fi

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linear-publish-results
          path: Estación 6/docs/tasks/linear-publish-results.json
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## 📊 Linear Publish Results" >> $GITHUB_STEP_SUMMARY
          if [ -f "Estación 6/docs/tasks/linear-publish-results.json" ]; then
            echo "✅ Configuration validated successfully" >> $GITHUB_STEP_SUMMARY
            echo "See artifact for detailed results" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Results file not found" >> $GITHUB_STEP_SUMMARY
          fi
