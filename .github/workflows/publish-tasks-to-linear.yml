name: Publish Tasks to Linear

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual issues created)'
        required: false
        default: 'false'

jobs:
  publish:
    name: Publish Tasks to Linear
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML requests

      - name: Publish tasks to Linear
        env:
          LINEAR_API_TOKEN: ${{ secrets.LINEAR_API_TOKEN }}
        run: |
          python scripts/publish-tasks-to-linear.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          if [ -f "Estación 6/docs/tasks/linear-publish-results.json" ]; then
            git add "Estación 6/docs/tasks/linear-publish-results.json"
            git commit -m "docs: Linear publish results - $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || true
            git push
          fi

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: linear-publish-results
          path: Estación 6/docs/tasks/linear-publish-results.json
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## 📊 Linear Publish Results" >> $GITHUB_STEP_SUMMARY

          if [ -f "Estación 6/docs/tasks/linear-publish-results.json" ]; then
            cat "Estación 6/docs/tasks/linear-publish-results.json" | python3 << 'EOF'
            import sys, json
            data = json.load(sys.stdin)
            print(f"**Issues Created**: {data['issues_created']}")
            print(f"**Workspace ID**: {data['workspace_id']}")
            print(f"**Team ID**: {data['team_id']}")
            print(f"**Timestamp**: {data['timestamp']}")
            print("\n### Created Issues\n")
            for issue in data['issues']:
              print(f"- [{issue['issue_identifier']}]({issue['url']}) - {issue['task_id']}")
            EOF
          else
            echo "No results file found"
          fi
