[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (database, APIs)
    e2e: End-to-end tests
    slow: Slow tests
    no_cov: Exclude from coverage

# Coverage options
addopts =
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80
    --tb=short
    -v

# Test paths
testpaths = tests

# Timeout for tests (seconds)
timeout = 300

# Minimum Python version
minversion = 7.0

# Database
asyncio_mode = auto
