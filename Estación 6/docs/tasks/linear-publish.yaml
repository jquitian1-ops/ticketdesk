# Conversion rules
conversionRules:
  priority:
    critical: "Urgent"
    high: "High"
    medium: "Medium"
    low: "Low"

  status:
    pending: "Todo"
    in_progress: "In Progress"
    blocked: "Blocked"
    ready_for_review: "In Review"
    approved: "Done"

  cycleName: "TicketDesk Enterprise v1.0"

# Validation checklist
validation:
  - [ ] All 20 tasks have Linear equivalent
  - [ ] Blockers/blocks relationships match task-package.yaml
  - [ ] All milestones have target dates
  - [ ] All tasks have estimates
  - [ ] No circular dependencies
  - [ ] Dry-run executed without errors
  - [ ] Issues created in Linear (status: Todo)

# Dry-run command
dryRun: |
  convert-tasks-to-linear \
    --config docs/tasks/linear-publish.yaml \
    --dry-run \
    --output docs/tasks/linear-publish-preview.json

# Publish command
publish: |
  convert-tasks-to-linear \
    --config docs/tasks/linear-publish.yaml \
    --execute \
    --output docs/tasks/linear-publish-results.json

